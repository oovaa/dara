name = "dara"
main = "src/index.ts"
compatibility_date = "2024-11-22"

[observability]
enabled = true

# Environment variables (set these in Cloudflare dashboard or using wrangler secret)
# For local development, create a .dev.vars file with these values
[vars]
NODE_ENV = "production"
FRONT_DOMAIN = "https://dara.example.com"

# Secrets (use: wrangler secret put API_KEY)
# API_KEY - Your Cohere API key

# For local development
# [env.dev]
# vars = { NODE_ENV = "development" }
